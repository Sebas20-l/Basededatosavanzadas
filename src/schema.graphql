# ---------------------------------------------------------------
# Catalogos
# ---------------------------------------------------------------

type Moneda {
  id: ID!
  codigo: String!
  nombre: String!
  simbolo: String!
  decimales: Int!
  activa: Boolean!
}

type EstadoPedido {
  id: ID!
  clave: String!
  nombre: String!
  orden: Int!
  esInicial: Boolean!
  esFinal: Boolean!
  # Claves de los estados a los que se puede pasar desde este
  transiciones: [String!]!
}

# ---------------------------------------------------------------
# Multiempresa: escuela -> negocios -> cafeterias
# ---------------------------------------------------------------

# Cada escuela es un "tenant": sus datos no se mezclan con los de otra
type Escuela {
  id: ID!
  # Identificador legible y unico, ademas del id (ej. "ULSA")
  clave: String!
  nombre: String!
  ciudad: String!
  activa: Boolean!
  # Cafeterias activas de la escuela (lo que ve el comprador)
  cafeterias: [Cafeteria!]!
}

# La marca de un dueno (JEFE). Puede tener varias cafeterias, incluso en varias escuelas.
type Negocio {
  id: ID!
  nombre: String!
  duenoId: ID!
  activo: Boolean!
  escuelas: [Escuela!]!
  cafeterias: [Cafeteria!]!
}

type Cafeteria {
  id: ID!
  nombre: String!
  # Donde esta dentro del campus (ej. "Edificio B, planta baja")
  ubicacion: String!
  escuelaId: ID!
  escuela: Escuela!
  negocioId: ID!
  negocio: Negocio!
  activa: Boolean!
}

enum Rol {
  ADMIN_PLATAFORMA
  ADMIN_ESCUELA
  JEFE
  VENDEDOR
  CLIENTE
}

# ---------------------------------------------------------------
# Datos del negocio
# ---------------------------------------------------------------

# Un monto siempre viaja con su moneda (codigo del catalogo: MXN, USD, JPY...)
type Dinero {
  monto: Float!
  moneda: String!
}

type Usuario {
  id: ID!
  nombre: String!
  correo: String!
  rol: Rol!
  # null solo para ADMIN_PLATAFORMA
  escuelaId: ID
  escuela: Escuela
  # Solo JEFE y VENDEDOR
  negocioId: ID
  # Solo VENDEDOR: la cafeteria donde atiende
  cafeteriaId: ID
}

type Inventario {
  stock: Int!
  puntoReorden: Int!
  cantidadReposicion: Int!
  # true cuando stock <= puntoReorden
  requiereReposicion: Boolean!
}

type Producto {
  id: ID!
  nombre: String!
  precio: Dinero!
  disponible: Boolean!
  inventario: Inventario!
  descripcion: String!
  categoria: String!
  # URL de Cloudinary; null si el producto aun no tiene imagen
  imagenUrl: String
  destacado: Boolean!
  etiqueta: String!
  # Minutos que tarda una orden; se usa para calcular la hora de recogida
  tiempoPreparacionMin: Int!
  # true si el vendedor lo pauso o ya no hay stock
  agotado: Boolean!
  cafeteriaId: ID!
  cafeteria: Cafeteria
}

# Una seccion del menu (ej. "Burritos") con sus productos; destacados primero
type CategoriaMenu {
  categoria: String!
  productos: [Producto!]!
}

type ItemPedido {
  productoId: ID!
  nombreProducto: String!
  precioUnitario: Dinero!
  cantidad: Int!
}

type CambioEstado {
  estado: String!
  # Fecha ISO 8601
  fecha: String!
  # Quien hizo el cambio
  usuarioId: ID
}

type Pedido {
  id: ID!
  usuarioId: ID!
  cafeteriaId: ID!
  items: [ItemPedido!]!
  total: Dinero!
  # Clave del catalogo de estados (ej. "PENDIENTE")
  estado: String!
  notas: String!
  # ---- Pickup ----
  # Minutos desde que se hizo el pedido hasta la hora de recogida
  tiempoEstimadoMin: Int
  # Fecha ISO 8601
  horaRecogida: String
  # Solo lo ve el comprador; lo muestra al recoger
  codigoRecogida: String
  # 1 = el siguiente en la cocina; null si ya salio de la cola
  posicionEnCola: Int
  historial: [CambioEstado!]!
  creadoEn: String
}

type EstimacionRecogida {
  tiempoEstimadoMin: Int!
  # Fecha ISO 8601
  horaRecogida: String!
  pedidosEnCola: Int!
}

# Ventas de una cafeteria (pipeline de agregacion de MongoDB)
type ResumenCafeteria {
  cafeteriaId: ID!
  nombreCafeteria: String!
  cafeteria: Cafeteria
  pedidos: Int!
  entregados: Int!
  cancelados: Int!
  # Solo cuenta pedidos ENTREGADO
  ingresos: Dinero!
  ticketPromedio: Dinero!
}

# Promedios calculados con el historial de estados de los pedidos entregados
type TiemposCafeteria {
  pedidosMedidos: Int!
  # De ACEPTADO a LISTO
  promedioPreparacionMin: Float
  # De que se hizo el pedido a que se entrego
  promedioTotalMin: Float
}

# Un cambio de estado guardado en Cassandra
type EventoPedido {
  pedidoId: ID!
  estado: String!
  # Fecha ISO 8601
  fecha: String!
  usuarioId: ID
  cafeteriaId: ID
  total: Float
}

# Metricas de una hora del dia (contadores de Cassandra)
type VentaPorHora {
  # 0 a 23, hora local de la escuela
  hora: Int!
  pedidos: Int!
  piezas: Int!
  entregados: Int!
  ingresos: Float!
}

type Notificacion {
  pedidoId: ID!
  estado: String!
  mensaje: String!
  # Fecha ISO 8601
  fecha: String!
}

# Reporte generado por el pipeline de agregacion, siempre acotado a una cafeteria.
# Se agrupa por producto Y moneda, para no sumar monedas distintas entre si.
type ProductoMasVendido {
  nombreProducto: String!
  unidadesVendidas: Int!
  ingresosTotales: Dinero!
}

# Respuesta del login: el token se manda despues en
#   Authorization: Bearer <token>
type SesionPayload {
  token: String!
  # Segundos de vida del token y de la sesion en Redis (TTL)
  expiraEn: Int!
  usuario: Usuario!
}

# Respuesta al registrar una escuela: el admin queda con sesion iniciada
type RegistroEscuelaPayload {
  escuela: Escuela!
  # Se comparte con los duenos de las cafeterias para que se registren
  codigoInvitacion: String!
  sesion: SesionPayload!
}

type RegistroNegocioPayload {
  negocio: Negocio!
  sesion: SesionPayload!
}

input CuentaInput {
  nombre: String!
  correo: String!
  password: String!
}

input RegistroEscuelaInput {
  clave: String!
  nombre: String!
  ciudad: String!
  # Cuenta del administrador de la escuela
  admin: CuentaInput!
}

input RegistroNegocioInput {
  # Codigo que da el admin de la escuela
  codigoInvitacion: String!
  nombreNegocio: String!
  dueno: CuentaInput!
}

input DineroInput {
  monto: Float!
  moneda: String!
}

input InventarioInput {
  stock: Int!
  puntoReorden: Int!
  cantidadReposicion: Int!
}

# Campos que el vendedor puede cambiar de un platillo; los que no se envian no cambian
input ProductoCambiosInput {
  nombre: String
  precio: DineroInput
  descripcion: String
  categoria: String
  # URL https de Cloudinary
  imagenUrl: String
  destacado: Boolean
  etiqueta: String
  disponible: Boolean
  tiempoPreparacionMin: Int
}

input ItemPedidoInput {
  productoId: ID!
  cantidad: Int!
}

enum TipoRecursoImagen {
  PRODUCTO
  PERFIL
}

# Parametros de autorizacion de subida generados por el backend con el API Secret
type FirmaCloudinary {
  signature: String!
  timestamp: Int!
  apiKey: String!
  cloudName: String!
  folder: String!
  uploadPreset: String!
}

type Query {
  # Protegida: requiere Authorization: Bearer <token> con sesion activa en Redis
  me: Usuario!

  monedas: [Moneda!]!
  estadosPedido: [EstadoPedido!]!

  # Texto de terminos y condiciones en formato markdown (publico, no requiere sesion)
  terminos: String!

  # ---- Catalogo publico (lo que ve el comprador) ----
  # Escuelas activas; busqueda opcional por nombre, clave o ciudad
  catalogoEscuelas(busqueda: String): [Escuela!]!
  escuelas: [Escuela!]!
  escuela(id: ID!): Escuela
  escuelaPorClave(clave: String!): Escuela

  cafeterias: [Cafeteria!]!
  cafeteria(id: ID!): Cafeteria
  cafeteriasPorEscuela(escuelaId: ID!): [Cafeteria!]!

  # ---- Administracion ----
  # ADMIN_ESCUELA: codigo para invitar a los duenos de cafeterias
  codigoInvitacion(escuelaId: ID!): String!
  # JEFE o VENDEDOR: el negocio al que pertenece la cuenta
  miNegocio: Negocio

  productosPorCafeteria(cafeteriaId: ID!): [Producto!]!
  # El mismo menu agrupado por categoria
  menuPorCategoria(cafeteriaId: ID!): [CategoriaMenu!]!
  # Otras cafeterias del mismo negocio y escuela donde si hay ese producto
  dondeHay(productoId: ID!): [Producto!]!
  producto(id: ID!): Producto
  # Productos cuyo stock ya llego al punto de reorden
  productosPorReponer(cafeteriaId: ID!): [Producto!]!

  # Protegidas: el pedido lo ve quien lo hizo o quien gestiona la cafeteria
  pedido(id: ID!): Pedido
  misPedidos: [Pedido!]!
  # Compatibilidad con la app: solo acepta el id del usuario de la sesion
  pedidosPorUsuario(usuarioId: ID!): [Pedido!]!
  pedidosPorCafeteria(cafeteriaId: ID!): [Pedido!]!
  # VENDEDOR: pedidos activos de la cafeteria, por hora de recogida
  colaCafeteria(cafeteriaId: ID!): [Pedido!]!
  # Publica: tiempo y hora de recogida si se pide ahora
  estimarRecogida(cafeteriaId: ID!, items: [ItemPedidoInput!]!): EstimacionRecogida!
  # ---- Reportes desde MongoDB (agregaciones) ----
  # JEFE: ventas de cada cafeteria de su negocio (sin negocioId usa el suyo)
  resumenNegocio(negocioId: ID): [ResumenCafeteria!]!
  # ADMIN_ESCUELA: ventas de cada cafeteria de la escuela
  resumenEscuela(escuelaId: ID!): [ResumenCafeteria!]!
  # JEFE: tiempo promedio de preparacion y de entrega
  tiemposCafeteria(cafeteriaId: ID!): TiemposCafeteria!

  # ---- Reportes desde Cassandra (dia con formato AAAA-MM-DD; por defecto hoy) ----
  # Bitacora de un pedido: lo ve quien lo hizo o quien gestiona la cafeteria
  eventosPedido(pedidoId: ID!): [EventoPedido!]!
  # VENDEDOR o JEFE: todo lo que paso en la cafeteria ese dia, lo mas reciente primero
  actividadCafeteria(cafeteriaId: ID!, dia: String, limite: Int = 100): [EventoPedido!]!
  # JEFE: pedidos y ventas por hora del dia
  horasPico(cafeteriaId: ID!, dia: String): [VentaPorHora!]!
  # Avisos de cambios de estado de mis pedidos (mas recientes primero)
  misNotificaciones(limite: Int = 20): [Notificacion!]!

  productosMasVendidos(cafeteriaId: ID!): [ProductoMasVendido!]!
}

type Mutation {
  # Firma un JWT con jti (UUID) y guarda SET sesion:<jti> <userId> EX <ttl>
  login(correo: String!, password: String!): SesionPayload!
  # Protegida: borra sesion:<jti> en Redis, el token queda revocado al instante
  logout: Boolean!
  # Registro publico de compradores (CLIENTE): crea la cuenta y ya devuelve su sesion.
  # Se manda escuelaId (elegida del catalogo); cafeteriaId se acepta por compatibilidad.
  registro(
    nombre: String!
    correo: String!
    password: String!
    escuelaId: ID
    cafeteriaId: ID
  ): SesionPayload!

  # ---- Multiempresa (la escuela se registra primero) ----
  # Publico: crea la escuela y su ADMIN_ESCUELA; devuelve el codigo de invitacion
  registrarEscuela(input: RegistroEscuelaInput!): RegistroEscuelaPayload!
  # ADMIN_ESCUELA: invalida el codigo anterior y genera otro
  regenerarCodigoInvitacion(escuelaId: ID!): String!
  # ADMIN_PLATAFORMA: suspende o reactiva una escuela
  cambiarEstadoEscuela(escuelaId: ID!, activa: Boolean!): Escuela!
  # Publico con codigo: crea el negocio y la cuenta JEFE de su dueno
  registrarNegocio(input: RegistroNegocioInput!): RegistroNegocioPayload!
  # JEFE: su negocio entra a otra escuela con el codigo de esa escuela
  unirNegocioAEscuela(codigoInvitacion: String!): Negocio!
  # JEFE: abre una cafeteria en una escuela donde ya esta su negocio
  registrarCafeteria(escuelaId: ID!, nombre: String!, ubicacion: String): Cafeteria!
  # JEFE: da de alta a un vendedor en una de sus cafeterias
  registrarVendedor(cafeteriaId: ID!, cuenta: CuentaInput!): Usuario!

  # ADMIN_PLATAFORMA
  registrarMoneda(codigo: String!, nombre: String!, simbolo: String!, decimales: Int = 2): Moneda!
  registrarProducto(
    nombre: String!
    precio: DineroInput!
    disponible: Boolean
    inventario: InventarioInput!
    cafeteriaId: ID!
    descripcion: String
    categoria: String
    imagenUrl: String
    destacado: Boolean
    etiqueta: String
    tiempoPreparacionMin: Int
  ): Producto!
  # VENDEDOR o JEFE de la cafeteria: edita un platillo
  actualizarProducto(productoId: ID!, cambios: ProductoCambiosInput!): Producto!
  # VENDEDOR o JEFE: marca un platillo como agotado o disponible
  cambiarDisponibilidadProducto(productoId: ID!, disponible: Boolean!): Producto!

  # Suma stock. Si no se indica cantidad, usa la cantidadReposicion del producto.
  reponerInventario(productoId: ID!, cantidad: Int): Producto!

  # Protegida: el pedido es del usuario de la sesion. Descuenta el stock en una transaccion.
  # horaRecogida (ISO 8601) es opcional: sin ella se usa la hora estimada mas pronta.
  crearPedido(
    cafeteriaId: ID!
    items: [ItemPedidoInput!]!
    horaRecogida: String
    notas: String
    usuarioId: ID @deprecated(reason: "El pedido siempre es del usuario de la sesion.")
  ): Pedido!
  # VENDEDOR o JEFE. Para pasar a ENTREGADO se pide el codigo de recogida del comprador.
  actualizarEstadoPedido(pedidoId: ID!, nuevoEstado: String!, codigoRecogida: String): Pedido!
  # Comprador: cancela su pedido mientras siga PENDIENTE; se regresa el stock
  cancelarPedido(pedidoId: ID!): Pedido!

  # Protegida: genera una firma de Cloudinary para autorizar subidas directas desde el cliente.
  # - tipo PERFIL: carpeta perfiles/<usuarioId> (cualquier usuario con sesion activa).
  # - tipo PRODUCTO: carpeta productos/cafeteria_<cafeteriaId> (requiere permiso PRODUCTO_GESTIONAR en esa cafeteria).
  solicitarFirmaSubida(tipo: TipoRecursoImagen!, cafeteriaId: ID): FirmaCloudinary!
}