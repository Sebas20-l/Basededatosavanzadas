# Topologia del proyecto: cuatro motores NoSQL en una red privada.
#
#   docker compose up -d
#
# La API (Apollo Server, puerto 4000) corre en la maquina host y se conecta
# a los contenedores por los puertos publicados.

services:
  # -------------------------------------------------------------
  # MongoDB: persistencia transaccional y fuente de verdad
  # -------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: bda-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"   # Protocolo nativo de MongoDB (driver de Mongoose)
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
    networks:
      - bda-network

  # -------------------------------------------------------------
  # Redis Stack: cache Cache-Aside y sesiones JWT con TTL
  # -------------------------------------------------------------
  redis-stack:
    image: redis/redis-stack:latest
    container_name: bda-redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"     # Protocolo RESP (cliente node-redis)
      - "8001:8001"     # RedisInsight (interfaz web)
    environment:
      REDIS_ARGS: "--requirepass password123"
    volumes:
      - redis_data:/data
    networks:
      - bda-network

  # -------------------------------------------------------------
  # Neo4j: grafo de autorizacion RBAC
  # -------------------------------------------------------------
  neo4j:
    image: neo4j:5.26
    container_name: bda-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"     # Neo4j Browser (HTTP)
      - "7687:7687"     # Protocolo Bolt (drivers)
    environment:
      NEO4J_AUTH: "neo4j/password123"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - ./neo4j:/var/lib/neo4j/import   # rbac.cypher queda disponible dentro del contenedor
    networks:
      - bda-network

  # -------------------------------------------------------------
  # Cassandra: bitacora de eventos de pedidos y metricas por hora
  # (tarda ~1 minuto en arrancar la primera vez)
  # -------------------------------------------------------------
  cassandra:
    image: cassandra:5.0
    container_name: bda-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"     # Protocolo CQL (cassandra-driver)
    environment:
      CASSANDRA_CLUSTER_NAME: bda-cluster
      # Limita la memoria para que corra en una laptop
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - bda-network

  # -------------------------------------------------------------
  # RabbitMQ: cola de eventos de seguridad (auditoria asincrona)
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq          # la prueba usa: docker stop rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # Protocolo AMQP (amqplib)
      - "15672:15672"   # RabbitMQ UI (guest / guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # la cola durable sobrevive reinicios
    networks:
      - bda-network

networks:
  bda-network:
    driver: bridge

volumes:
  rabbitmq_data:
  mongodb_data:
  redis_data:
  neo4j_data:
  cassandra_data:
